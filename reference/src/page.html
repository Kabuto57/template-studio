<title>Template Studio</title>
<style>
/* Layout: Keynote-style window. Toolbar with insert buttons on top, slide navigator left, canvas centre, inspector right. Neutral greys; one blue for selection and the primary action. */
:root {
  color-scheme: light;
  --window: #FFFFFF;
  --sidebar: #F6F6F8;
  --canvas: #E9E9EC;
  --hair: rgba(0, 0, 0, .09);
  --hair-2: rgba(0, 0, 0, .14);
  --ink: #1D1D1F;
  --ink-2: #424245;
  --muted: #86868B;
  --fill: rgba(0, 0, 0, .045);
  --fill-2: rgba(0, 0, 0, .08);
  --accent: #0071E3;
  --accent-press: #0062C4;
  --accent-soft: rgba(0, 113, 227, .09);
  --danger: #D70015;
  --ok: #248A3D;
  --warn: #B25000;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Helvetica Neue", "Segoe UI", Arial, sans-serif;
  --mono: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
  --tb: 58px;
  /* one type scale, two control heights */
  --fs-xs: 11px; --fs-sm: 12px; --fs: 13px; --fs-lg: 15px; --fs-xl: 20px;
  --ctl: 28px; --ctl-sm: 24px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--window); color: var(--ink); font: var(--fs)/1.45 var(--font); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid rgba(0, 113, 227, .35); outline-offset: 1px; border-radius: 6px; }
h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: -.01em; }
code, .mono { font-family: var(--mono); font-size: .92em; }

/* ---------- toolbar ---------- */
.toolbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; min-height: var(--tb);
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 6px 14px;
  background: rgba(250, 250, 252, .86); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 1px solid var(--hair);
}
.doc { display: flex; flex-direction: column; min-width: 0; width: 200px; }
.doc .app-name { font-size: var(--fs-xs); color: var(--muted); padding-left: 7px; }
#projName { border: 0; background: transparent; border-radius: 6px; padding: 2px 6px; font-weight: 600; font-size: var(--fs); min-width: 0; width: 100%; }
#projName:hover { background: var(--fill); }
#projName:focus { background: #fff; box-shadow: 0 0 0 3px rgba(0, 113, 227, .3); outline: none; }
.insert { display: flex; gap: 2px; align-items: stretch; }
@media (max-width: 760px) { .insert { order: 3; width: 100%; overflow-x: auto; } .doc { width: auto; flex: 1; } }
.tool {
  display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 50px; padding: 5px 6px 4px;
  border: 0; background: transparent; border-radius: 8px; cursor: grab; color: var(--ink-2); user-select: none;
}
.tool:hover { background: var(--fill); }
.tool:active { background: var(--fill-2); cursor: grabbing; }
.tool svg { width: 20px; height: 20px; }
.tool span { font-size: var(--fs-xs); color: var(--muted); white-space: nowrap; }
.spacer { flex: 1; }
.seg { display: inline-flex; gap: 0; padding: 2px; border-radius: 8px; background: var(--fill-2); }
.seg button {
  border: 0; background: transparent; height: calc(var(--ctl) - 4px); padding: 0 12px; border-radius: 6px; cursor: pointer;
  font-weight: 500; font-size: var(--fs); color: var(--ink); display: inline-flex; align-items: center; justify-content: center;
}
.seg button[aria-selected="true"], .seg button[aria-pressed="true"] { background: #fff; box-shadow: 0 0 0 .5px rgba(0, 0, 0, .05), 0 1px 3px rgba(0, 0, 0, .14); }
.seg.small button { height: calc(var(--ctl-sm) - 4px); padding: 0 10px; font-size: var(--fs-sm); }
.seg.full { display: flex; }
.seg.full button { flex: 1; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: var(--ctl); padding: 0 12px; border-radius: 6px; font-size: var(--fs);
  border: 0; background: #fff; color: var(--ink); cursor: pointer; font-weight: 500; white-space: nowrap;
  box-shadow: 0 0 0 .5px rgba(0, 0, 0, .14), 0 1px 1.5px rgba(0, 0, 0, .08);
}
.btn:hover { background: #FAFAFA; }
.btn:active { background: #F0F0F2; }
.btn.primary { background: var(--accent); color: #fff; box-shadow: 0 0 0 .5px rgba(0, 0, 0, .1), 0 1px 1.5px rgba(0, 0, 0, .12); }
.btn.primary:hover { background: var(--accent-press); }
.btn.small { height: var(--ctl-sm); padding: 0 9px; font-size: var(--fs-sm); }
.btn.plain { background: transparent; box-shadow: none; color: var(--accent); }
.btn.plain:hover { background: var(--accent-soft); }
.btn.danger { color: var(--danger); }
.btn.plain.danger:hover { background: rgba(215, 0, 21, .08); }
.btn:disabled { opacity: .4; cursor: default; }
.icon-btn { border: 0; background: transparent; width: var(--ctl); height: var(--ctl); border-radius: 6px; display: grid; place-items: center; cursor: pointer; color: var(--ink-2); }
.icon-btn:hover { background: var(--fill); }
.icon-btn:disabled { opacity: .3; cursor: default; background: transparent; }
.icon-btn svg { width: 18px; height: 18px; }
.menu-wrap { position: relative; }
.menu {
  position: absolute; right: 0; top: calc(100% + 6px); z-index: 40; min-width: 250px; padding: 5px; border-radius: 10px;
  background: rgba(252, 252, 252, .92); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
  box-shadow: 0 0 0 .5px rgba(0, 0, 0, .15), 0 10px 30px rgba(0, 0, 0, .16); display: flex; flex-direction: column;
}
.menu button { border: 0; background: transparent; text-align: left; padding: 6px 10px; border-radius: 6px; cursor: pointer; }
.menu button:hover { background: var(--accent); color: #fff; }
.menu button:hover small { color: rgba(255, 255, 255, .85); }
.menu b { font-weight: 500; }
.menu small { display: block; color: var(--muted); font-size: var(--fs-sm); }
.confirm { width: 100%; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 6px 2px; }
.confirm span { font-weight: 500; }

/* ---------- window body ---------- */
.app { display: grid; grid-template-columns: 196px minmax(0, 1fr) 300px; min-height: calc(100dvh - var(--tb)); }
.app.code { grid-template-columns: minmax(0, 1fr); }
@media (max-width: 1100px) { .app { grid-template-columns: minmax(0, 1fr); } .nav { order: 2; } .canvas { order: 1; } .panel { order: 3; } }
.nav, .panel {
  background: var(--sidebar); min-width: 0; overflow: auto;
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--tb)); height: calc(100dvh - var(--tb));
}
.nav { border-right: 1px solid var(--hair); padding: 14px 12px; display: flex; flex-direction: column; gap: 12px; }
.panel { border-left: 1px solid var(--hair); background: var(--window); }
@media (max-width: 1100px) { .nav, .panel { position: static; height: auto; border: 0; border-top: 1px solid var(--hair); } }
.hint { color: var(--muted); font-size: var(--fs-sm); }

/* slide navigator */
.strip { display: flex; flex-direction: column; gap: 12px; }
@media (max-width: 1100px) { .strip { flex-direction: row; overflow-x: auto; } }
.thumb { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 6px; align-items: start; cursor: pointer; border: 0; background: none; padding: 0; text-align: left; }
@media (max-width: 1100px) { .thumb { width: 170px; flex: none; } }
.thumb .no { font-size: var(--fs-xs); color: var(--muted); text-align: right; padding-top: 2px; font-variant-numeric: tabular-nums; }
.thumb .slide { border-radius: 3px; box-shadow: 0 0 0 1px var(--hair-2); pointer-events: none; }
.thumb[aria-current="true"] .slide { box-shadow: 0 0 0 3px var(--accent); }
.thumb[aria-current="true"] .no { color: var(--accent); font-weight: 600; }
.thumb-acts { grid-column: 2; display: flex; gap: 8px; margin-top: 3px; visibility: hidden; }
.thumb:hover .thumb-acts, .thumb[aria-current="true"] .thumb-acts, .thumb:focus-within .thumb-acts { visibility: visible; }
.thumb-acts button { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; font-size: var(--fs-xs); }
.thumb-acts button[data-act="del"] { color: var(--danger); }
.add-slide { border: 0; background: transparent; color: var(--accent); cursor: pointer; height: var(--ctl); padding: 0 0 0 22px; font-size: var(--fs); text-align: left; font-weight: 500; border-radius: 6px; }
.add-slide:hover { background: var(--fill); }

/* canvas */
.canvas { background: var(--canvas); padding: 22px 28px 40px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.canvas-bar { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; color: var(--muted); font-size: var(--fs-sm); max-width: 1180px; width: 100%; margin: 0 auto; }
.slide-host { width: 100%; max-width: 1180px; margin: 0 auto; position: relative; }
.slide { position: relative; width: 100%; container-type: inline-size; overflow: hidden; background: #fff; color: #000; box-shadow: 0 0 0 .5px rgba(0, 0, 0, .08), 0 2px 4px rgba(0, 0, 0, .05), 0 12px 32px rgba(0, 0, 0, .08); touch-action: none; }
.slide .shp { position: absolute; }
.slide .txt { position: absolute; inset: 0; display: flex; flex-direction: column; overflow: visible; }
.slide .para { white-space: pre-wrap; overflow-wrap: break-word; }
.slide table { position: absolute; border-collapse: collapse; table-layout: fixed; }
.slide td { padding: 0; vertical-align: top; }
.slide .ph { white-space: nowrap; background: rgba(0, 113, 227, .10); box-shadow: inset 0 0 0 1px rgba(0, 113, 227, .38); border-radius: .25em; padding: 0 .2em; color: inherit; }
.slide.editable [data-obj]:hover { outline: 1px solid rgba(0, 113, 227, .5); }
.slide.editable td.hit:hover { outline: 1px solid rgba(0, 113, 227, .6); outline-offset: -1px; }
.slide td.hit.cellsel { outline: 2px solid var(--accent) !important; outline-offset: -2px; }
.slide .drop-target { outline: 2px solid var(--accent) !important; outline-offset: 2px; background-color: rgba(0, 113, 227, .06); }
.overlay { position: absolute; border: 1px solid var(--accent); pointer-events: none; z-index: 20; }
.overlay .h { position: absolute; width: 9px; height: 9px; background: #fff; border: 1px solid var(--accent); border-radius: 50%; pointer-events: auto; box-shadow: 0 1px 2px rgba(0, 0, 0, .2); }
.overlay .h[data-h="nw"] { left: -5px; top: -5px; cursor: nwse-resize; }
.overlay .h[data-h="ne"] { right: -5px; top: -5px; cursor: nesw-resize; }
.overlay .h[data-h="sw"] { left: -5px; bottom: -5px; cursor: nesw-resize; }
.overlay .h[data-h="se"] { right: -5px; bottom: -5px; cursor: nwse-resize; }
.overlay .h[data-h="n"] { left: calc(50% - 4.5px); top: -5px; cursor: ns-resize; }
.overlay .h[data-h="s"] { left: calc(50% - 4.5px); bottom: -5px; cursor: ns-resize; }
.overlay .h[data-h="w"] { top: calc(50% - 4.5px); left: -5px; cursor: ew-resize; }
.overlay .h[data-h="e"] { top: calc(50% - 4.5px); right: -5px; cursor: ew-resize; }
.overlay .size { position: absolute; left: 50%; transform: translateX(-50%); top: calc(100% + 7px); white-space: nowrap; font: 500 var(--fs-xs)/1.5 var(--font); color: #fff; background: rgba(0, 0, 0, .72); padding: 0 7px; border-radius: 4px; font-variant-numeric: tabular-nums; }
.drop-ghost { position: absolute; border: 1.5px dashed var(--accent); background: rgba(0, 113, 227, .05); pointer-events: none; z-index: 21; }

/* inspector */
.panel-tabs { position: sticky; top: 0; z-index: 2; background: var(--window); padding: 12px 16px; border-bottom: 1px solid var(--hair); }
.pane { display: flex; flex-direction: column; }
.sect { padding: 16px; border-bottom: 1px solid var(--hair); display: flex; flex-direction: column; gap: 12px; }
.sect:last-child { border-bottom: 0; }
.sect-title { font-size: var(--fs); font-weight: 600; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.sect-title .hint { font-weight: 400; }
.empty-note { padding: 28px 18px; color: var(--muted); text-align: center; line-height: 1.5; }
.insp-head { display: flex; justify-content: space-between; align-items: center; gap: 6px 8px; flex-wrap: wrap; }
.insp-head h2 { font-size: var(--fs-lg); white-space: nowrap; }
.tools { display: flex; flex-wrap: wrap; gap: 0; }
.lbl { display: block; font-size: var(--fs-sm); color: var(--ink-2); margin-bottom: 4px; }
.inp {
  width: 100%; min-width: 0; height: var(--ctl); border: 0; border-radius: 6px; padding: 0 8px; background: #fff; font-size: var(--fs);
  box-shadow: inset 0 0 0 1px var(--hair-2); transition: box-shadow .12s;
}
.inp:focus { outline: none; box-shadow: inset 0 0 0 1px var(--accent), 0 0 0 3px rgba(0, 113, 227, .25); }
textarea.inp { height: auto; padding: 6px 8px; resize: vertical; font-family: var(--mono); font-size: var(--fs-sm); line-height: 1.5; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.two { display: grid; grid-template-columns: minmax(0, 1fr) 76px; gap: 8px; }
.style-row { display: grid; grid-template-columns: 72px 1fr; gap: 10px; align-items: end; }
input[type=color] { width: 100%; height: var(--ctl); padding: 3px; border: 0; border-radius: 6px; background: #fff; box-shadow: inset 0 0 0 1px var(--hair-2); cursor: pointer; }
input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }
input[type=color]::-webkit-color-swatch { border: 0; border-radius: 4px; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .12); }
input[type=color]::-moz-color-swatch { border: 0; border-radius: 4px; }
.rule { display: grid; grid-template-columns: minmax(0, 1fr) 36px 36px auto; gap: 6px; align-items: center; }

/* field list (Finder-like rows) */
.flist { display: flex; flex-direction: column; gap: 1px; }
.fgroup { display: flex; flex-direction: column; gap: 1px; margin-top: 6px; }
.fgroup-h { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; padding: 6px 6px 2px; font-size: var(--fs-xs); font-weight: 600; color: var(--muted); cursor: pointer; border-radius: 5px; }
.fgroup-h:hover { background: var(--fill); }
.chip { display: flex; align-items: center; gap: 8px; min-height: var(--ctl-sm); padding: 0 6px; border-radius: 6px; font-size: var(--fs); cursor: grab; user-select: none; min-width: 0; }
.fgroup .chip { padding-left: 14px; }
.chip:hover { background: var(--fill); }
.chip:active { cursor: grabbing; }
.chip.sel { background: var(--accent); color: #fff; }
.chip.sel .t, .chip.sel svg { color: rgba(255, 255, 255, .85); }
.chip svg { width: 14px; height: 14px; color: var(--muted); flex: none; }
.chip .k { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip .t { font-size: var(--fs-xs); color: var(--muted); flex: none; }
.chip.pending .k { color: var(--muted); font-style: italic; }
.chip.pending.sel .k { color: #fff; }
.field-card { display: flex; flex-direction: column; gap: 10px; padding-top: 2px; }
.field-card + .field-card { border-top: 1px solid var(--hair); padding-top: 12px; }
.field-card .key { font-weight: 600; border: 0; background: transparent; border-radius: 6px; height: var(--ctl); padding: 0 6px; margin-left: -6px; flex: 1 1 auto; min-width: 0; width: 100%; font-size: var(--fs); }
.field-card .key:hover { background: var(--fill); }
.field-card .key:focus { outline: none; background: #fff; box-shadow: inset 0 0 0 1px var(--accent), 0 0 0 3px rgba(0, 113, 227, .25); }
.field-card select { flex: none; width: auto !important; }
.tip { color: var(--ink-2); display: flex; flex-direction: column; gap: 5px; }
.tip b { font-weight: 600; }

/* test view */
#testJson { min-height: 50vh; }
.status { display: flex; flex-direction: column; gap: 4px; }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 7px; vertical-align: 1px; }
.dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--danger); }
.callout { border-radius: 8px; padding: 8px 12px; background: var(--fill); }
.callout.bad { background: rgba(215, 0, 21, .06); color: var(--danger); }

/* code view */
.code-page { max-width: 900px; width: 100%; margin: 0 auto; padding-block: 28px 56px; padding-inline: 20px; display: flex; flex-direction: column; gap: 28px; }
.code-page > header h2 { font-size: var(--fs-xl); }
.code-page > header p { margin: 6px 0 0; color: var(--muted); font-size: var(--fs); max-width: 64ch; }
.step { display: flex; flex-direction: column; gap: 12px; }
.step-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; }
.step-h .num { color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; }
.step-h h2 { font-size: var(--fs-lg); }
.step-h p { margin: 0; color: var(--muted); flex-basis: 100%; }
.step-body { display: flex; flex-direction: column; gap: 10px; }
pre.code { margin: 0; padding: 12px 14px; overflow: auto; max-height: 46vh; font: var(--fs-sm)/1.6 var(--mono); white-space: pre; background: var(--sidebar); border-radius: 8px; box-shadow: inset 0 0 0 1px var(--hair); }
table.io { border-collapse: collapse; width: 100%; }
table.io th, table.io td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--hair); }
table.io th { font-weight: 500; color: var(--muted); font-size: var(--fs-sm); }
.io-wrap { overflow-x: auto; }
.code-page hr { border: 0; border-top: 1px solid var(--hair); margin: 0; }

.toast {
  position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 22px); transform: translateX(-50%);
  background: rgba(30, 30, 32, .9); color: #fff; padding: 7px 14px; border-radius: 8px; font-weight: 500; z-index: 60;
  box-shadow: 0 6px 20px rgba(0, 0, 0, .18); max-width: calc(100% - 32px);
}
.drop-file .slide-host { outline: 2px dashed var(--accent); outline-offset: 8px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<header class="toolbar">
  <div class="doc">
    <span class="app-name">Template Studio</span>
    <input id="projName" type="text" spellcheck="false" aria-label="Template name">
  </div>
  <div class="insert" id="blocks" aria-label="Insert"></div>
  <span class="spacer"></span>
  <div class="seg" role="tablist" aria-label="Steps">
    <button type="button" role="tab" data-view="design" aria-selected="true">Design</button>
    <button type="button" role="tab" data-view="test" aria-selected="false">Test</button>
    <button type="button" role="tab" data-view="code" aria-selected="false">Get code</button>
  </div>
  <button class="icon-btn" id="undoBtn" type="button" disabled title="Undo (Ctrl+Z)" aria-label="Undo">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 5 4 8.5 7.5 12"/><path d="M4.5 8.5H12a4 4 0 0 1 0 8H9"/></svg>
  </button>
  <div class="menu-wrap">
    <button class="btn" id="openMenuBtn" type="button" aria-haspopup="true" aria-expanded="false">New / Open</button>
    <div class="menu" id="openMenu" hidden>
      <button type="button" data-open="blank"><b>Blank slide</b><small>Start empty and insert blocks</small></button>
      <button type="button" data-open="file"><b>Open…</b><small>A .pptx, or a fill_pptx.py from this tool</small></button>
      <button type="button" data-open="sample"><b>Audit report sample</b><small>A finished two-slide example</small></button>
    </div>
  </div>
  <button class="btn primary" id="kitBtn" type="button">Download kit</button>
  <input id="fileInput" type="file" accept=".pptx,.py,.txt" hidden>
  <div class="confirm" id="confirmBar" hidden>
    <span id="confirmMsg"></span>
    <button class="btn small primary" id="confirmYes" type="button">Replace</button>
    <button class="btn small" id="confirmNo" type="button">Cancel</button>
  </div>
</header>

<main class="app" id="app">
  <nav class="nav" id="nav" aria-label="Slides">
    <div class="strip" id="strip"></div>
  </nav>

  <section class="canvas" id="canvas" aria-label="Slide">
    <div class="canvas-bar"><span id="canvasHint"></span><span id="canvasMeta"></span></div>
    <div class="slide-host" id="slideHost"></div>
  </section>
  <section id="codePage" class="code-page" hidden></section>

  <aside class="panel" id="panel">
    <div id="designPanel">
      <div class="panel-tabs">
        <div class="seg full small" role="tablist" aria-label="Inspector">
          <button type="button" role="tab" data-rtab="format" aria-selected="true">Format</button>
          <button type="button" role="tab" data-rtab="fields" aria-selected="false">Fields</button>
          <button type="button" role="tab" data-rtab="document" aria-selected="false">Document</button>
        </div>
      </div>
      <div class="pane" id="formatPane"><div id="inspector"></div></div>
      <div class="pane" id="fieldsPane" hidden>
        <div class="sect">
          <div class="sect-title">Fields <span class="hint">drag onto a box or cell</span></div>
          <div id="fieldList" class="flist"></div>
          <div class="row" style="flex-wrap:nowrap">
            <input class="inp" id="newField" type="text" placeholder="New field name" spellcheck="false" aria-label="New field name">
            <button class="btn small" id="newFieldBtn" type="button">Add</button>
          </div>
        </div>
        <div id="fieldSettings"></div>
      </div>
      <div class="pane" id="documentPane" hidden></div>
    </div>
    <div id="testPanel" hidden>
      <div class="sect">
        <div class="sect-title">Test data</div>
        <span class="hint">Paste the JSON your LLM returned. The slides update as you type.</span>
        <div class="status" id="testStatus"></div>
        <textarea class="inp" id="testJson" spellcheck="false" aria-label="Test JSON"></textarea>
        <div class="row">
          <button class="btn primary" type="button" id="dlFilledBtn">Download filled deck</button>
          <button class="btn plain" type="button" id="resetTestBtn">Reset to example</button>
        </div>
      </div>
    </div>
  </aside>
