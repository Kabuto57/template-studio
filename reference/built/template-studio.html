<title>Template Studio</title>
<style>
/* Layout: Keynote-style window. Toolbar with insert buttons on top, slide navigator left, canvas centre, inspector right. Neutral greys; one blue for selection and the primary action. */
:root {
  color-scheme: light;
  --window: #FFFFFF;
  --sidebar: #F6F6F8;
  --canvas: #E9E9EC;
  --hair: rgba(0, 0, 0, .09);
  --hair-2: rgba(0, 0, 0, .14);
  --ink: #1D1D1F;
  --ink-2: #424245;
  --muted: #86868B;
  --fill: rgba(0, 0, 0, .045);
  --fill-2: rgba(0, 0, 0, .08);
  --accent: #0071E3;
  --accent-press: #0062C4;
  --accent-soft: rgba(0, 113, 227, .09);
  --danger: #D70015;
  --ok: #248A3D;
  --warn: #B25000;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Helvetica Neue", "Segoe UI", Arial, sans-serif;
  --mono: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
  --tb: 58px;
  /* one type scale, two control heights */
  --fs-xs: 11px; --fs-sm: 12px; --fs: 13px; --fs-lg: 15px; --fs-xl: 20px;
  --ctl: 28px; --ctl-sm: 24px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--window); color: var(--ink); font: var(--fs)/1.45 var(--font); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid rgba(0, 113, 227, .35); outline-offset: 1px; border-radius: 6px; }
h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: -.01em; }
code, .mono { font-family: var(--mono); font-size: .92em; }

/* ---------- toolbar ---------- */
.toolbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; min-height: var(--tb);
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 6px 14px;
  background: rgba(250, 250, 252, .86); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 1px solid var(--hair);
}
.doc { display: flex; flex-direction: column; min-width: 0; width: 200px; }
.doc .app-name { font-size: var(--fs-xs); color: var(--muted); padding-left: 7px; }
#projName { border: 0; background: transparent; border-radius: 6px; padding: 2px 6px; font-weight: 600; font-size: var(--fs); min-width: 0; width: 100%; }
#projName:hover { background: var(--fill); }
#projName:focus { background: #fff; box-shadow: 0 0 0 3px rgba(0, 113, 227, .3); outline: none; }
.insert { display: flex; gap: 2px; align-items: stretch; }
@media (max-width: 760px) { .insert { order: 3; width: 100%; overflow-x: auto; } .doc { width: auto; flex: 1; } }
.tool {
  display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 50px; padding: 5px 6px 4px;
  border: 0; background: transparent; border-radius: 8px; cursor: grab; color: var(--ink-2); user-select: none;
}
.tool:hover { background: var(--fill); }
.tool:active { background: var(--fill-2); cursor: grabbing; }
.tool svg { width: 20px; height: 20px; }
.tool span { font-size: var(--fs-xs); color: var(--muted); white-space: nowrap; }
.spacer { flex: 1; }
.seg { display: inline-flex; gap: 0; padding: 2px; border-radius: 8px; background: var(--fill-2); }
.seg button {
  border: 0; background: transparent; height: calc(var(--ctl) - 4px); padding: 0 12px; border-radius: 6px; cursor: pointer;
  font-weight: 500; font-size: var(--fs); color: var(--ink); display: inline-flex; align-items: center; justify-content: center;
}
.seg button[aria-selected="true"], .seg button[aria-pressed="true"] { background: #fff; box-shadow: 0 0 0 .5px rgba(0, 0, 0, .05), 0 1px 3px rgba(0, 0, 0, .14); }
.seg.small button { height: calc(var(--ctl-sm) - 4px); padding: 0 10px; font-size: var(--fs-sm); }
.seg.full { display: flex; }
.seg.full button { flex: 1; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: var(--ctl); padding: 0 12px; border-radius: 6px; font-size: var(--fs);
  border: 0; background: #fff; color: var(--ink); cursor: pointer; font-weight: 500; white-space: nowrap;
  box-shadow: 0 0 0 .5px rgba(0, 0, 0, .14), 0 1px 1.5px rgba(0, 0, 0, .08);
}
.btn:hover { background: #FAFAFA; }
.btn:active { background: #F0F0F2; }
.btn.primary { background: var(--accent); color: #fff; box-shadow: 0 0 0 .5px rgba(0, 0, 0, .1), 0 1px 1.5px rgba(0, 0, 0, .12); }
.btn.primary:hover { background: var(--accent-press); }
.btn.small { height: var(--ctl-sm); padding: 0 9px; font-size: var(--fs-sm); }
.btn.plain { background: transparent; box-shadow: none; color: var(--accent); }
.btn.plain:hover { background: var(--accent-soft); }
.btn.danger { color: var(--danger); }
.btn.plain.danger:hover { background: rgba(215, 0, 21, .08); }
.btn:disabled { opacity: .4; cursor: default; }
.icon-btn { border: 0; background: transparent; width: var(--ctl); height: var(--ctl); border-radius: 6px; display: grid; place-items: center; cursor: pointer; color: var(--ink-2); }
.icon-btn:hover { background: var(--fill); }
.icon-btn:disabled { opacity: .3; cursor: default; background: transparent; }
.icon-btn svg { width: 18px; height: 18px; }
.menu-wrap { position: relative; }
.menu {
  position: absolute; right: 0; top: calc(100% + 6px); z-index: 40; min-width: 250px; padding: 5px; border-radius: 10px;
  background: rgba(252, 252, 252, .92); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
  box-shadow: 0 0 0 .5px rgba(0, 0, 0, .15), 0 10px 30px rgba(0, 0, 0, .16); display: flex; flex-direction: column;
}
.menu button { border: 0; background: transparent; text-align: left; padding: 6px 10px; border-radius: 6px; cursor: pointer; }
.menu button:hover { background: var(--accent); color: #fff; }
.menu button:hover small { color: rgba(255, 255, 255, .85); }
.menu b { font-weight: 500; }
.menu small { display: block; color: var(--muted); font-size: var(--fs-sm); }
.confirm { width: 100%; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 6px 2px; }
.confirm span { font-weight: 500; }

/* ---------- window body ---------- */
.app { display: grid; grid-template-columns: 196px minmax(0, 1fr) 300px; min-height: calc(100dvh - var(--tb)); }
.app.code { grid-template-columns: minmax(0, 1fr); }
@media (max-width: 1100px) { .app { grid-template-columns: minmax(0, 1fr); } .nav { order: 2; } .canvas { order: 1; } .panel { order: 3; } }
.nav, .panel {
  background: var(--sidebar); min-width: 0; overflow: auto;
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--tb)); height: calc(100dvh - var(--tb));
}
.nav { border-right: 1px solid var(--hair); padding: 14px 12px; display: flex; flex-direction: column; gap: 12px; }
.panel { border-left: 1px solid var(--hair); background: var(--window); }
@media (max-width: 1100px) { .nav, .panel { position: static; height: auto; border: 0; border-top: 1px solid var(--hair); } }
.hint { color: var(--muted); font-size: var(--fs-sm); }

/* slide navigator */
.strip { display: flex; flex-direction: column; gap: 12px; }
@media (max-width: 1100px) { .strip { flex-direction: row; overflow-x: auto; } }
.thumb { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 6px; align-items: start; cursor: pointer; border: 0; background: none; padding: 0; text-align: left; }
@media (max-width: 1100px) { .thumb { width: 170px; flex: none; } }
.thumb .no { font-size: var(--fs-xs); color: var(--muted); text-align: right; padding-top: 2px; font-variant-numeric: tabular-nums; }
.thumb .slide { border-radius: 3px; box-shadow: 0 0 0 1px var(--hair-2); pointer-events: none; }
.thumb[aria-current="true"] .slide { box-shadow: 0 0 0 3px var(--accent); }
.thumb[aria-current="true"] .no { color: var(--accent); font-weight: 600; }
.thumb-acts { grid-column: 2; display: flex; gap: 8px; margin-top: 3px; visibility: hidden; }
.thumb:hover .thumb-acts, .thumb[aria-current="true"] .thumb-acts, .thumb:focus-within .thumb-acts { visibility: visible; }
.thumb-acts button { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; font-size: var(--fs-xs); }
.thumb-acts button[data-act="del"] { color: var(--danger); }
.add-slide { border: 0; background: transparent; color: var(--accent); cursor: pointer; height: var(--ctl); padding: 0 0 0 22px; font-size: var(--fs); text-align: left; font-weight: 500; border-radius: 6px; }
.add-slide:hover { background: var(--fill); }

/* canvas */
.canvas { background: var(--canvas); padding: 22px 28px 40px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.canvas-bar { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; color: var(--muted); font-size: var(--fs-sm); max-width: 1180px; width: 100%; margin: 0 auto; }
.slide-host { width: 100%; max-width: 1180px; margin: 0 auto; position: relative; }
.slide { position: relative; width: 100%; container-type: inline-size; overflow: hidden; background: #fff; color: #000; box-shadow: 0 0 0 .5px rgba(0, 0, 0, .08), 0 2px 4px rgba(0, 0, 0, .05), 0 12px 32px rgba(0, 0, 0, .08); touch-action: none; }
.slide .shp { position: absolute; }
.slide .txt { position: absolute; inset: 0; display: flex; flex-direction: column; overflow: visible; }
.slide .para { white-space: pre-wrap; overflow-wrap: break-word; }
.slide table { position: absolute; border-collapse: collapse; table-layout: fixed; }
.slide td { padding: 0; vertical-align: top; }
.slide .ph { white-space: nowrap; background: rgba(0, 113, 227, .10); box-shadow: inset 0 0 0 1px rgba(0, 113, 227, .38); border-radius: .25em; padding: 0 .2em; color: inherit; }
.slide.editable [data-obj]:hover { outline: 1px solid rgba(0, 113, 227, .5); }
.slide.editable td.hit:hover { outline: 1px solid rgba(0, 113, 227, .6); outline-offset: -1px; }
.slide td.hit.cellsel { outline: 2px solid var(--accent) !important; outline-offset: -2px; }
.slide .drop-target { outline: 2px solid var(--accent) !important; outline-offset: 2px; background-color: rgba(0, 113, 227, .06); }
.overlay { position: absolute; border: 1px solid var(--accent); pointer-events: none; z-index: 20; }
.overlay .h { position: absolute; width: 9px; height: 9px; background: #fff; border: 1px solid var(--accent); border-radius: 50%; pointer-events: auto; box-shadow: 0 1px 2px rgba(0, 0, 0, .2); }
.overlay .h[data-h="nw"] { left: -5px; top: -5px; cursor: nwse-resize; }
.overlay .h[data-h="ne"] { right: -5px; top: -5px; cursor: nesw-resize; }
.overlay .h[data-h="sw"] { left: -5px; bottom: -5px; cursor: nesw-resize; }
.overlay .h[data-h="se"] { right: -5px; bottom: -5px; cursor: nwse-resize; }
.overlay .h[data-h="n"] { left: calc(50% - 4.5px); top: -5px; cursor: ns-resize; }
.overlay .h[data-h="s"] { left: calc(50% - 4.5px); bottom: -5px; cursor: ns-resize; }
.overlay .h[data-h="w"] { top: calc(50% - 4.5px); left: -5px; cursor: ew-resize; }
.overlay .h[data-h="e"] { top: calc(50% - 4.5px); right: -5px; cursor: ew-resize; }
.overlay .size { position: absolute; left: 50%; transform: translateX(-50%); top: calc(100% + 7px); white-space: nowrap; font: 500 var(--fs-xs)/1.5 var(--font); color: #fff; background: rgba(0, 0, 0, .72); padding: 0 7px; border-radius: 4px; font-variant-numeric: tabular-nums; }
.drop-ghost { position: absolute; border: 1.5px dashed var(--accent); background: rgba(0, 113, 227, .05); pointer-events: none; z-index: 21; }

/* inspector */
.panel-tabs { position: sticky; top: 0; z-index: 2; background: var(--window); padding: 12px 16px; border-bottom: 1px solid var(--hair); }
.pane { display: flex; flex-direction: column; }
.sect { padding: 16px; border-bottom: 1px solid var(--hair); display: flex; flex-direction: column; gap: 12px; }
.sect:last-child { border-bottom: 0; }
.sect-title { font-size: var(--fs); font-weight: 600; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.sect-title .hint { font-weight: 400; }
.empty-note { padding: 28px 18px; color: var(--muted); text-align: center; line-height: 1.5; }
.insp-head { display: flex; justify-content: space-between; align-items: center; gap: 6px 8px; flex-wrap: wrap; }
.insp-head h2 { font-size: var(--fs-lg); white-space: nowrap; }
.tools { display: flex; flex-wrap: wrap; gap: 0; }
.lbl { display: block; font-size: var(--fs-sm); color: var(--ink-2); margin-bottom: 4px; }
.inp {
  width: 100%; min-width: 0; height: var(--ctl); border: 0; border-radius: 6px; padding: 0 8px; background: #fff; font-size: var(--fs);
  box-shadow: inset 0 0 0 1px var(--hair-2); transition: box-shadow .12s;
}
.inp:focus { outline: none; box-shadow: inset 0 0 0 1px var(--accent), 0 0 0 3px rgba(0, 113, 227, .25); }
textarea.inp { height: auto; padding: 6px 8px; resize: vertical; font-family: var(--mono); font-size: var(--fs-sm); line-height: 1.5; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.two { display: grid; grid-template-columns: minmax(0, 1fr) 76px; gap: 8px; }
.style-row { display: grid; grid-template-columns: 72px 1fr; gap: 10px; align-items: end; }
input[type=color] { width: 100%; height: var(--ctl); padding: 3px; border: 0; border-radius: 6px; background: #fff; box-shadow: inset 0 0 0 1px var(--hair-2); cursor: pointer; }
input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }
input[type=color]::-webkit-color-swatch { border: 0; border-radius: 4px; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .12); }
input[type=color]::-moz-color-swatch { border: 0; border-radius: 4px; }
.rule { display: grid; grid-template-columns: minmax(0, 1fr) 36px 36px auto; gap: 6px; align-items: center; }

/* field list (Finder-like rows) */
.flist { display: flex; flex-direction: column; gap: 1px; }
.fgroup { display: flex; flex-direction: column; gap: 1px; margin-top: 6px; }
.fgroup-h { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; padding: 6px 6px 2px; font-size: var(--fs-xs); font-weight: 600; color: var(--muted); cursor: pointer; border-radius: 5px; }
.fgroup-h:hover { background: var(--fill); }
.chip { display: flex; align-items: center; gap: 8px; min-height: var(--ctl-sm); padding: 0 6px; border-radius: 6px; font-size: var(--fs); cursor: grab; user-select: none; min-width: 0; }
.fgroup .chip { padding-left: 14px; }
.chip:hover { background: var(--fill); }
.chip:active { cursor: grabbing; }
.chip.sel { background: var(--accent); color: #fff; }
.chip.sel .t, .chip.sel svg { color: rgba(255, 255, 255, .85); }
.chip svg { width: 14px; height: 14px; color: var(--muted); flex: none; }
.chip .k { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip .t { font-size: var(--fs-xs); color: var(--muted); flex: none; }
.chip.pending .k { color: var(--muted); font-style: italic; }
.chip.pending.sel .k { color: #fff; }
.field-card { display: flex; flex-direction: column; gap: 10px; padding-top: 2px; }
.field-card + .field-card { border-top: 1px solid var(--hair); padding-top: 12px; }
.field-card .key { font-weight: 600; border: 0; background: transparent; border-radius: 6px; height: var(--ctl); padding: 0 6px; margin-left: -6px; flex: 1 1 auto; min-width: 0; width: 100%; font-size: var(--fs); }
.field-card .key:hover { background: var(--fill); }
.field-card .key:focus { outline: none; background: #fff; box-shadow: inset 0 0 0 1px var(--accent), 0 0 0 3px rgba(0, 113, 227, .25); }
.field-card select { flex: none; width: auto !important; }
.tip { color: var(--ink-2); display: flex; flex-direction: column; gap: 5px; }
.tip b { font-weight: 600; }

/* test view */
#testJson { min-height: 50vh; }
.status { display: flex; flex-direction: column; gap: 4px; }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 7px; vertical-align: 1px; }
.dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--danger); }
.callout { border-radius: 8px; padding: 8px 12px; background: var(--fill); }
.callout.bad { background: rgba(215, 0, 21, .06); color: var(--danger); }

/* code view */
.code-page { max-width: 900px; width: 100%; margin: 0 auto; padding-block: 28px 56px; padding-inline: 20px; display: flex; flex-direction: column; gap: 28px; }
.code-page > header h2 { font-size: var(--fs-xl); }
.code-page > header p { margin: 6px 0 0; color: var(--muted); font-size: var(--fs); max-width: 64ch; }
.step { display: flex; flex-direction: column; gap: 12px; }
.step-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; }
.step-h .num { color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; }
.step-h h2 { font-size: var(--fs-lg); }
.step-h p { margin: 0; color: var(--muted); flex-basis: 100%; }
.step-body { display: flex; flex-direction: column; gap: 10px; }
pre.code { margin: 0; padding: 12px 14px; overflow: auto; max-height: 46vh; font: var(--fs-sm)/1.6 var(--mono); white-space: pre; background: var(--sidebar); border-radius: 8px; box-shadow: inset 0 0 0 1px var(--hair); }
table.io { border-collapse: collapse; width: 100%; }
table.io th, table.io td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--hair); }
table.io th { font-weight: 500; color: var(--muted); font-size: var(--fs-sm); }
.io-wrap { overflow-x: auto; }
.code-page hr { border: 0; border-top: 1px solid var(--hair); margin: 0; }

.toast {
  position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 22px); transform: translateX(-50%);
  background: rgba(30, 30, 32, .9); color: #fff; padding: 7px 14px; border-radius: 8px; font-weight: 500; z-index: 60;
  box-shadow: 0 6px 20px rgba(0, 0, 0, .18); max-width: calc(100% - 32px);
}
.drop-file .slide-host { outline: 2px dashed var(--accent); outline-offset: 8px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<header class="toolbar">
  <div class="doc">
    <span class="app-name">Template Studio</span>
    <input id="projName" type="text" spellcheck="false" aria-label="Template name">
  </div>
  <div class="insert" id="blocks" aria-label="Insert"></div>
  <span class="spacer"></span>
  <div class="seg" role="tablist" aria-label="Steps">
    <button type="button" role="tab" data-view="design" aria-selected="true">Design</button>
    <button type="button" role="tab" data-view="test" aria-selected="false">Test</button>
    <button type="button" role="tab" data-view="code" aria-selected="false">Get code</button>
  </div>
  <button class="icon-btn" id="undoBtn" type="button" disabled title="Undo (Ctrl+Z)" aria-label="Undo">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 5 4 8.5 7.5 12"/><path d="M4.5 8.5H12a4 4 0 0 1 0 8H9"/></svg>
  </button>
  <div class="menu-wrap">
    <button class="btn" id="openMenuBtn" type="button" aria-haspopup="true" aria-expanded="false">New / Open</button>
    <div class="menu" id="openMenu" hidden>
      <button type="button" data-open="blank"><b>Blank slide</b><small>Start empty and insert blocks</small></button>
      <button type="button" data-open="file"><b>Open…</b><small>A .pptx, or a fill_pptx.py from this tool</small></button>
      <button type="button" data-open="sample"><b>Audit report sample</b><small>A finished two-slide example</small></button>
    </div>
  </div>
  <button class="btn primary" id="kitBtn" type="button">Download kit</button>
  <input id="fileInput" type="file" accept=".pptx,.py,.txt" hidden>
  <div class="confirm" id="confirmBar" hidden>
    <span id="confirmMsg"></span>
    <button class="btn small primary" id="confirmYes" type="button">Replace</button>
    <button class="btn small" id="confirmNo" type="button">Cancel</button>
  </div>
</header>

<main class="app" id="app">
  <nav class="nav" id="nav" aria-label="Slides">
    <div class="strip" id="strip"></div>
  </nav>

  <section class="canvas" id="canvas" aria-label="Slide">
    <div class="canvas-bar"><span id="canvasHint"></span><span id="canvasMeta"></span></div>
    <div class="slide-host" id="slideHost"></div>
  </section>
  <section id="codePage" class="code-page" hidden></section>

  <aside class="panel" id="panel">
    <div id="designPanel">
      <div class="panel-tabs">
        <div class="seg full small" role="tablist" aria-label="Inspector">
          <button type="button" role="tab" data-rtab="format" aria-selected="true">Format</button>
          <button type="button" role="tab" data-rtab="fields" aria-selected="false">Fields</button>
          <button type="button" role="tab" data-rtab="document" aria-selected="false">Document</button>
        </div>
      </div>
      <div class="pane" id="formatPane"><div id="inspector"></div></div>
      <div class="pane" id="fieldsPane" hidden>
        <div class="sect">
          <div class="sect-title">Fields <span class="hint">drag onto a box or cell</span></div>
          <div id="fieldList" class="flist"></div>
          <div class="row" style="flex-wrap:nowrap">
            <input class="inp" id="newField" type="text" placeholder="New field name" spellcheck="false" aria-label="New field name">
            <button class="btn small" id="newFieldBtn" type="button">Add</button>
          </div>
        </div>
        <div id="fieldSettings"></div>
      </div>
      <div class="pane" id="documentPane" hidden></div>
    </div>
    <div id="testPanel" hidden>
      <div class="sect">
        <div class="sect-title">Test data</div>
        <span class="hint">Paste the JSON your LLM returned. The slides update as you type.</span>
        <div class="status" id="testStatus"></div>
        <textarea class="inp" id="testJson" spellcheck="false" aria-label="Test JSON"></textarea>
        <div class="row">
          <button class="btn primary" type="button" id="dlFilledBtn">Download filled deck</button>
          <button class="btn plain" type="button" id="resetTestBtn">Reset to example</button>
        </div>
      </div>
    </div>
  </aside>

<script>
// MiniZip — reads and writes .zip/.pptx files with the browser's built-in
// CompressionStream / DecompressionStream. No external libraries.
const MiniZip = (() => {
  const CRC_TABLE = (() => {
    const t = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
      t[n] = c >>> 0;
    }
    return t;
  })();
  function crc32(u8) {
    let c = 0xFFFFFFFF;
    for (let i = 0; i < u8.length; i++) c = CRC_TABLE[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }
  async function pipe(u8, stream) {
    const res = new Response(new Blob([u8]).stream().pipeThrough(stream));
    return new Uint8Array(await res.arrayBuffer());
  }
  const inflate = u8 => pipe(u8, new DecompressionStream("deflate-raw"));
  const deflate = u8 => pipe(u8, new CompressionStream("deflate-raw"));
  const enc = new TextEncoder(), dec = new TextDecoder("utf-8");
  const supported = () => typeof CompressionStream === "function" && typeof DecompressionStream === "function";

  class Zip {
    constructor() { this.entries = new Map(); } // name -> { data?: Uint8Array, raw?: {method, crc, size, comp} }

    static async load(bytes) {
      const u8 = bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes);
      const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
      let eocd = -1;
      for (let i = u8.length - 22; i >= Math.max(0, u8.length - 65557); i--) {
        if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
      }
      if (eocd < 0) throw new Error("This file isn't a valid .pptx (zip) file.");
      const count = dv.getUint16(eocd + 10, true);
      let p = dv.getUint32(eocd + 16, true);
      const z = new Zip();
      for (let i = 0; i < count; i++) {
        if (dv.getUint32(p, true) !== 0x02014b50) throw new Error("The file's zip directory is damaged.");
        const method = dv.getUint16(p + 10, true), crc = dv.getUint32(p + 16, true);
        const compSize = dv.getUint32(p + 20, true), size = dv.getUint32(p + 24, true);
        const nLen = dv.getUint16(p + 28, true), xLen = dv.getUint16(p + 30, true), cLen = dv.getUint16(p + 32, true);
        const off = dv.getUint32(p + 42, true);
        const name = dec.decode(u8.subarray(p + 46, p + 46 + nLen));
        const start = off + 30 + dv.getUint16(off + 26, true) + dv.getUint16(off + 28, true);
        z.entries.set(name, { raw: { method, crc, size, comp: u8.slice(start, start + compSize) } });
        p += 46 + nLen + xLen + cLen;
      }
      return z;
    }
    names() { return [...this.entries.keys()]; }
    has(name) { return this.entries.has(name); }
    delete(name) { this.entries.delete(name); }
    async bytes(name) {
      const e = this.entries.get(name);
      if (!e) return null;
      if (!e.data) {
        const r = e.raw;
        if (r.method === 0) e.data = r.comp;
        else if (r.method === 8) e.data = await inflate(r.comp);
        else throw new Error(`Unsupported compression in ${name}`);
      }
      return e.data;
    }
    async text(name) { const b = await this.bytes(name); return b ? dec.decode(b) : null; }
    set(name, content) {
      const data = typeof content === "string" ? enc.encode(content) : (content instanceof Uint8Array ? content : new Uint8Array(content));
      this.entries.set(name, { data, dirty: true });
    }
    async generate() {
      const locals = [], centrals = [];
      let offset = 0;
      for (const [name, e] of this.entries) {
        let method, crc, size, comp;
        if (e.raw && !e.dirty) ({ method, crc, size, comp } = e.raw);
        else {
          const data = e.data;
          crc = crc32(data); size = data.length;
          const d = data.length > 64 ? await deflate(data) : null;
          if (d && d.length < data.length) { method = 8; comp = d; } else { method = 0; comp = data; }
          e.raw = { method, crc, size, comp }; e.dirty = false;
        }
        const nm = enc.encode(name);
        const lh = new DataView(new ArrayBuffer(30));
        lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true);
        lh.setUint16(8, method, true); lh.setUint16(10, 0, true); lh.setUint16(12, 0x21, true);
        lh.setUint32(14, crc, true); lh.setUint32(18, comp.length, true); lh.setUint32(22, size, true);
        lh.setUint16(26, nm.length, true); lh.setUint16(28, 0, true);
        const ch = new DataView(new ArrayBuffer(46));
        ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true);
        ch.setUint16(10, method, true); ch.setUint16(12, 0, true); ch.setUint16(14, 0x21, true);
        ch.setUint32(16, crc, true); ch.setUint32(20, comp.length, true); ch.setUint32(24, size, true);
        ch.setUint16(28, nm.length, true); ch.setUint32(42, offset, true);
        locals.push(new Uint8Array(lh.buffer), nm, comp);
        centrals.push(new Uint8Array(ch.buffer), nm);
        offset += 30 + nm.length + comp.length;
      }
      const cdSize = centrals.reduce((a, b) => a + b.length, 0);
      const end = new DataView(new ArrayBuffer(22));
      end.setUint32(0, 0x06054b50, true);
      end.setUint16(8, this.entries.size, true); end.setUint16(10, this.entries.size, true);
      end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);
      const parts = [...locals, ...centrals, new Uint8Array(end.buffer)];
      const out = new Uint8Array(parts.reduce((a, b) => a + b.length, 0));
      let pos = 0;
      for (const part of parts) { out.set(part, pos); pos += part.length; }
      return out;
    }
  }
  return { Zip, crc32, supported };
})();

// Fill engine — a line-for-line port of engine.py so the browser preview and the
// generated Python produce the same slides.
const Engine = (() => {
  const PH = () => /\{\{\s*([^{}]+?)\s*\}\}/g;
  const PARA_RE = () => /<a:p(?:\s[^>]*)?>.*?<\/a:p>/gs;
  const RUN_RE = () => /<a:r(?:\s[^>]*)?>.*?<\/a:r>/gs;
  const TEXT_RE = () => /(<a:t(?:\s[^>]*)?>)(.*?)(<\/a:t>)|<a:t\s*\/>/gs;
  const ROW_RE = () => /<a:tr(?:\s[^>]*)?>.*?<\/a:tr>/gs;
  const CELL_RE = () => /<a:tc(?:\s[^>]*)?>.*?<\/a:tc>/gs;
  const TBL_RE = () => /<a:tbl>.*?<\/a:tbl>/gs;
  const BORDER_RE = () => /<a:(ln[LRTB]|lnTlToBr|lnBlToTr)\b(?:[^>]*\/>|.*?<\/a:\1>)/gs;
  const FILL_RE = () => /<a:(solidFill|noFill|gradFill|pattFill|blipFill|grpFill)\b(?:[^>]*\/>|.*?<\/a:\1>)/gs;
  const LN_RE = () => /<a:ln\b(?:[^>]*\/>|.*?<\/a:ln>)/s;

  const xmlEscape = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const xmlUnescape = s => s
    .replace(/&#x([0-9a-fA-F]+);/g, (_, h) => String.fromCodePoint(parseInt(h, 16)))
    .replace(/&#([0-9]+);/g, (_, d) => String.fromCodePoint(parseInt(d, 10)))
    .replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, '"')
    .replace(/&apos;/g, "'").replace(/&amp;/g, "&");

  const isObj = v => v !== null && typeof v === "object" && !Array.isArray(v);
  const has = (o, k) => isObj(o) && Object.prototype.hasOwnProperty.call(o, k);

  function walk(data, path) {
    if (has(data, path)) return [true, data[path]];
    let cur = data;
    for (const part of path.split(".")) {
      if (has(cur, part)) cur = cur[part];
      else if (Array.isArray(cur) && /^\d+$/.test(part) && +part >= 1 && +part <= cur.length) cur = cur[+part - 1];
      else return [false, null];
    }
    return [true, cur];
  }

  function toText(v) {
    if (v === null || v === undefined) return "";
    if (typeof v === "boolean") return v ? "Yes" : "No";
    if (Array.isArray(v)) return v.map(toText).join(", ");
    if (isObj(v)) return JSON.stringify(v);
    return String(v).replace(/\r\n/g, "\n").replace(/\n/g, " ");
  }

  function lookup(data, key) {
    if (key.startsWith("count:")) {
      let expr = key.slice(6).trim(), cond = null;
      const eq = expr.indexOf("=");
      if (eq >= 0) {
        const left = expr.slice(0, eq).trim(), wanted = expr.slice(eq + 1).trim().toLowerCase();
        const dot = left.lastIndexOf(".");
        if (dot < 0) return [false, null];
        expr = left.slice(0, dot).trim();
        cond = [left.slice(dot + 1).trim(), wanted];
      }
      const [found, items] = walk(data, expr);
      if (!found || !Array.isArray(items)) return [false, null];
      if (!cond) return [true, items.length];
      return [true, items.filter(it => isObj(it) && toText(it[cond[0]]).trim().toLowerCase() === cond[1]).length];
    }
    return walk(data, key);
  }

  function parseContent(content) {
    if (isObj(content)) return content;
    const text = String(content).trim().replace(/^```(?:json)?\s*|\s*```$/g, "");
    const parsed = JSON.parse(text);
    if (!isObj(parsed)) throw new Error("the content must be a JSON object");
    return parsed;
  }

  const runText = r => [...r.matchAll(TEXT_RE())].map(m => xmlUnescape(m[2] || "")).join("");

  function setRunText(runXml, text) {
    let done = false;
    return runXml.replace(TEXT_RE(), () => {
      if (done) return "";
      done = true;
      return "<a:t>" + xmlEscape(text) + "</a:t>";
    });
  }

  function fillParagraph(p, data, report) {
    const runs = [...p.matchAll(RUN_RE())];
    if (!runs.length) return p;
    const texts = runs.map(r => runText(r[0]));
    const full = texts.join("");
    if (!full.includes("{{")) return p;
    const matches = [...full.matchAll(PH())];
    if (!matches.length) return p;

    if (matches.length === 1 && full.trim() === matches[0][0]) {
      const key = matches[0][1];
      let [found, value] = lookup(data, key);
      if (found && typeof value === "string" && value.trim().includes("\n"))
        value = value.trim().split(/\r\n|\n|\r/).filter(x => x.trim());
      if (found && Array.isArray(value)) {
        report.replaced.add(key);
        const items = value.length ? value.map(toText) : [""];
        const start = runs[0].index, end = runs[runs.length - 1].index + runs[runs.length - 1][0].length;
        return items.map(it => p.slice(0, start) + setRunText(runs[0][0], it) + p.slice(end)).join("");
      }
    }

    const bounds = []; let pos = 0;
    for (const t of texts) { bounds.push([pos, pos + t.length]); pos += t.length; }
    const nt = texts.slice();
    for (const m of matches.slice().reverse()) {
      const key = m[1];
      const [found, value] = lookup(data, key);
      (found ? report.replaced : report.missing).add(key);
      const rep = found ? toText(value) : "";
      const ms = m.index, me = m.index + m[0].length;
      let first = true;
      bounds.forEach(([rs, re_], i) => {
        if (re_ <= ms || rs >= me) return;
        const a = Math.max(ms, rs) - rs, b = Math.min(me, re_) - rs;
        nt[i] = nt[i].slice(0, a) + (first ? rep : "") + nt[i].slice(b);
        first = false;
      });
    }
    let out = "", last = 0;
    runs.forEach((r, i) => {
      out += p.slice(last, r.index) + (texts[i] === nt[i] ? r[0] : setRunText(r[0], nt[i]));
      last = r.index + r[0].length;
    });
    return out + p.slice(last);
  }

  const fillParagraphs = (xml, data, report) => xml.replace(PARA_RE(), m => fillParagraph(m, data, report));
  const visibleText = xml => [...xml.matchAll(RUN_RE())].map(r => runText(r[0])).join("");

  function colourCell(cell, rules) {
    const text = visibleText(cell).trim().toLowerCase();
    const rule = text && rules.find(r => String(r.match || "").trim().toLowerCase() === text);
    if (!rule) return cell;
    const fill = `<a:solidFill><a:srgbClr val="${rule.fill}"/></a:solidFill>`;
    const color = `<a:solidFill><a:srgbClr val="${rule.text}"/></a:solidFill>`;
    if (cell.includes("<a:tcPr")) {
      cell = cell.replace(/(<a:tcPr(?:\s[^>]*)?>)(.*?)<\/a:tcPr>|<a:tcPr(?:\s[^>]*)?\/>/s, (whole, open, body) => {
        open = open || whole.slice(0, -2) + ">";
        body = body || "";
        const borders = [...body.matchAll(BORDER_RE())].map(b => b[0]).join("");
        const rest = body.replace(BORDER_RE(), "").replace(FILL_RE(), "").trim();
        return open + borders + fill + rest + "</a:tcPr>";
      });
    } else {
      cell = cell.replace("</a:tc>", "<a:tcPr>" + fill + "</a:tcPr></a:tc>");
    }
    return cell.replace(RUN_RE(), r => {
      if (r.includes("<a:rPr")) {
        return r.replace(/<a:rPr([^>]*?)(?:\/>|>(.*?)<\/a:rPr>)/s, (_, attrs, body) => {
          body = body || "";
          attrs = attrs.replace(/\sb="[^"]*"/g, "") + ' b="1"';
          const ln = body.match(LN_RE());
          const lnXml = ln ? ln[0] : "";
          const rest = lnXml ? body.replace(lnXml, "") : body;
          return `<a:rPr${attrs}>${lnXml}${color}${rest.replace(FILL_RE(), "")}</a:rPr>`;
        });
      }
      return r.replace("<a:r>", `<a:r><a:rPr b="1">${color}</a:rPr>`);
    });
  }

  function fillTable(tbl, data, report, rules) {
    return tbl.replace(ROW_RE(), rowXml => {
      let ph = false, val = false;
      const out = rowXml.replace(CELL_RE(), c => {
        const hasPh = PH().test(visibleText(c));
        c = fillParagraphs(c, data, report);
        if (hasPh) { ph = true; val = val || !!visibleText(c).trim(); }
        return colourCell(c, rules);
      });
      return ph && !val ? "" : out;
    });
  }

  function fillXml(xml, data, report, rules) {
    xml = xml.replace(TBL_RE(), t => fillTable(t, data, report, rules));
    return fillParagraphs(xml, data, report);
  }

  // Rewrites placeholders in place (used for renaming a field). fn(key) -> new text or null to keep.
  function rewritePlaceholders(xml, fn) {
    return xml.replace(PARA_RE(), p => {
      const runs = [...p.matchAll(RUN_RE())];
      if (!runs.length) return p;
      const texts = runs.map(r => runText(r[0]));
      const full = texts.join("");
      if (!full.includes("{{")) return p;
      const bounds = []; let pos = 0;
      for (const t of texts) { bounds.push([pos, pos + t.length]); pos += t.length; }
      const nt = texts.slice();
      for (const m of [...full.matchAll(PH())].reverse()) {
        const rep = fn(m[1]);
        if (rep === null || rep === undefined) continue;
        const ms = m.index, me = m.index + m[0].length;
        let first = true;
        bounds.forEach(([rs, re_], i) => {
          if (re_ <= ms || rs >= me) return;
          const a = Math.max(ms, rs) - rs, b = Math.min(me, re_) - rs;
          nt[i] = nt[i].slice(0, a) + (first ? rep : "") + nt[i].slice(b);
          first = false;
        });
      }
      let out = "", last = 0;
      runs.forEach((r, i) => {
        out += p.slice(last, r.index) + (texts[i] === nt[i] ? r[0] : setRunText(r[0], nt[i]));
        last = r.index + r[0].length;
      });
      return out + p.slice(last);
    });
  }

  // Every placeholder in a slide, with whether it sits alone in its paragraph.
  function scanPlaceholders(xml) {
    const found = [];
    for (const pm of xml.matchAll(PARA_RE())) {
      const full = visibleText(pm[0]);
      const ms = [...full.matchAll(PH())];
      ms.forEach(m => found.push({ key: m[1], alone: ms.length === 1 && full.trim() === m[0] }));
    }
    return found;
  }

  const isSlidePart = name => /^ppt\/(slides\/slide|notesSlides\/notesSlide)\d+\.xml$/.test(name);

  return { fillXml, lookup, walk, toText, parseContent, rewritePlaceholders, scanPlaceholders,
           visibleText, isSlidePart, xmlEscape, xmlUnescape, PH };
})();

</script>
<script>
"use strict";
const ENGINE_PY = "import base64\nimport io\nimport json\nimport re\nimport sys\nimport zipfile\n\n# =========================================================================== placeholder rules\n#   {{key}}                       text (keeps the template's formatting)\n#   {{key}} alone in a paragraph  + a list value -> one paragraph / bullet per item\n#   {{client.name}}               nested object  {\"client\": {\"name\": ...}}\n#   {{findings.2.title}}          item 2 of a list {\"findings\": [{...}, {\"title\": ...}]}\n#   {{count:findings}}            number of items in the list (calculated)\n#   {{count:findings.risk=High}}  number of items whose \"risk\" is High (calculated)\n#   table rows                    a row whose placeholders all come out empty is removed\n#   colour rules                  table cells whose text matches a rule get its colours\n\nPLACEHOLDER_RE = re.compile(r\"\\{\\{\\s*([^{}]+?)\\s*\\}\\}\")\nPARA_RE = re.compile(r\"<a:p(?:\\s[^>]*)?>.*?</a:p>\", re.S)\nRUN_RE = re.compile(r\"<a:r(?:\\s[^>]*)?>.*?</a:r>\", re.S)\nTEXT_RE = re.compile(r\"(<a:t(?:\\s[^>]*)?>)(.*?)(</a:t>)|<a:t\\s*/>\", re.S)\nROW_RE = re.compile(r\"<a:tr(?:\\s[^>]*)?>.*?</a:tr>\", re.S)\nCELL_RE = re.compile(r\"<a:tc(?:\\s[^>]*)?>.*?</a:tc>\", re.S)\nTBL_RE = re.compile(r\"<a:tbl>.*?</a:tbl>\", re.S)\nBORDER_RE = re.compile(r\"<a:(ln[LRTB]|lnTlToBr|lnBlToTr)\\b(?:[^>]*/>|.*?</a:\\1>)\", re.S)\nFILL_RE = re.compile(r\"<a:(solidFill|noFill|gradFill|pattFill|blipFill|grpFill)\\b(?:[^>]*/>|.*?</a:\\1>)\", re.S)\nLN_RE = re.compile(r\"<a:ln\\b(?:[^>]*/>|.*?</a:ln>)\", re.S)\n\n\ndef xml_escape(s):\n    return s.replace(\"&\", \"&amp;\").replace(\"<\", \"&lt;\").replace(\">\", \"&gt;\")\n\n\ndef xml_unescape(s):\n    s = re.sub(r\"&#x([0-9a-fA-F]+);\", lambda m: chr(int(m.group(1), 16)), s)\n    s = re.sub(r\"&#([0-9]+);\", lambda m: chr(int(m.group(1))), s)\n    return (s.replace(\"&lt;\", \"<\").replace(\"&gt;\", \">\").replace(\"&quot;\", '\"')\n             .replace(\"&apos;\", \"'\").replace(\"&amp;\", \"&\"))\n\n\n# =========================================================================== values\n\n\ndef walk(data, path):\n    \"\"\"Follow 'a.b.2.c' through dicts and lists (list positions start at 1).\"\"\"\n    if path in data:\n        return True, data[path]\n    cur = data\n    for part in path.split(\".\"):\n        if isinstance(cur, dict) and part in cur:\n            cur = cur[part]\n        elif isinstance(cur, list) and part.isdigit() and 1 <= int(part) <= len(cur):\n            cur = cur[int(part) - 1]\n        else:\n            return False, None\n    return True, cur\n\n\ndef lookup(data, key):\n    if key.startswith(\"count:\"):\n        expr = key[6:].strip()\n        cond = None\n        if \"=\" in expr:\n            expr, wanted = expr.split(\"=\", 1)\n            expr, field = expr.strip().rsplit(\".\", 1)\n            cond = (field.strip(), wanted.strip().lower())\n        found, items = walk(data, expr)\n        if not found or not isinstance(items, list):\n            return False, None\n        if cond is None:\n            return True, len(items)\n        return True, sum(1 for it in items\n                         if isinstance(it, dict) and to_text(it.get(cond[0])).strip().lower() == cond[1])\n    return walk(data, key)\n\n\ndef to_text(value):\n    if value is None:\n        return \"\"\n    if isinstance(value, bool):\n        return \"Yes\" if value else \"No\"\n    if isinstance(value, (list, tuple)):\n        return \", \".join(to_text(v) for v in value)\n    if isinstance(value, dict):\n        return json.dumps(value, ensure_ascii=False, separators=(\",\", \":\"))\n    if isinstance(value, float) and value.is_integer():\n        value = int(value)\n    return str(value).replace(\"\\r\\n\", \"\\n\").replace(\"\\n\", \" \")\n\n\ndef parse_content(content):\n    \"\"\"Accept a dict or a JSON string (```json fences from an LLM are fine).\"\"\"\n    if isinstance(content, dict):\n        return content\n    text = re.sub(r\"^```(?:json)?\\s*|\\s*```$\", \"\", str(content).strip())\n    parsed = json.loads(text)\n    if not isinstance(parsed, dict):\n        raise ValueError(\"the content must be a JSON object\")\n    return parsed\n\n\n# =========================================================================== XML text editing\n\n\ndef run_text(run_xml):\n    return \"\".join(xml_unescape(m.group(2) or \"\") for m in TEXT_RE.finditer(run_xml))\n\n\ndef set_run_text(run_xml, text):\n    done = [False]\n\n    def repl(m):\n        if done[0]:\n            return \"\"\n        done[0] = True\n        return \"<a:t>%s</a:t>\" % xml_escape(text)\n\n    return TEXT_RE.sub(repl, run_xml)\n\n\ndef fill_paragraph(p_xml, data, report):\n    runs = list(RUN_RE.finditer(p_xml))\n    if not runs:\n        return p_xml\n    texts = [run_text(r.group(0)) for r in runs]\n    full = \"\".join(texts)\n    if \"{{\" not in full:\n        return p_xml\n    matches = list(PLACEHOLDER_RE.finditer(full))\n    if not matches:\n        return p_xml\n\n    # Only \"{{key}}\" in the paragraph and the value is a list -> one paragraph per item.\n    if len(matches) == 1 and full.strip() == matches[0].group(0):\n        key = matches[0].group(1)\n        found, value = lookup(data, key)\n        if found and isinstance(value, str) and \"\\n\" in value.strip():\n            value = [x for x in value.strip().splitlines() if x.strip()]\n        if found and isinstance(value, (list, tuple)):\n            report[\"replaced\"].add(key)\n            items = [to_text(v) for v in value] or [\"\"]\n            start, end = runs[0].start(), runs[-1].end()\n            return \"\".join(p_xml[:start] + set_run_text(runs[0].group(0), it) + p_xml[end:] for it in items)\n\n    bounds, pos = [], 0\n    for t in texts:\n        bounds.append((pos, pos + len(t)))\n        pos += len(t)\n    new_texts = list(texts)\n    for m in reversed(matches):\n        key = m.group(1)\n        found, value = lookup(data, key)\n        report[\"replaced\" if found else \"missing\"].add(key)\n        replacement = to_text(value) if found else \"\"\n        first = True\n        for i, (rs, re_) in enumerate(bounds):\n            if re_ <= m.start() or rs >= m.end():\n                continue\n            a, b = max(m.start(), rs) - rs, min(m.end(), re_) - rs\n            new_texts[i] = new_texts[i][:a] + (replacement if first else \"\") + new_texts[i][b:]\n            first = False\n\n    out, last = [], 0\n    for r, old, new in zip(runs, texts, new_texts):\n        out.append(p_xml[last:r.start()])\n        out.append(r.group(0) if old == new else set_run_text(r.group(0), new))\n        last = r.end()\n    out.append(p_xml[last:])\n    return \"\".join(out)\n\n\ndef fill_paragraphs(xml, data, report):\n    return PARA_RE.sub(lambda m: fill_paragraph(m.group(0), data, report), xml)\n\n\ndef visible_text(xml):\n    return \"\".join(run_text(r.group(0)) for r in RUN_RE.finditer(xml))\n\n\ndef colour_cell(cell_xml, rules):\n    text = visible_text(cell_xml).strip().lower()\n    rule = next((r for r in rules if str(r.get(\"match\", \"\")).strip().lower() == text and text), None)\n    if not rule:\n        return cell_xml\n    fill = '<a:solidFill><a:srgbClr val=\"%s\"/></a:solidFill>' % rule[\"fill\"]\n    color = '<a:solidFill><a:srgbClr val=\"%s\"/></a:solidFill>' % rule[\"text\"]\n\n    def tcpr(m):\n        open_tag = m.group(1) or m.group(0)[:-2] + \">\"\n        body = m.group(2) or \"\"\n        borders = \"\".join(b.group(0) for b in BORDER_RE.finditer(body))\n        rest = FILL_RE.sub(\"\", BORDER_RE.sub(\"\", body)).strip()\n        return open_tag + borders + fill + rest + \"</a:tcPr>\"\n\n    if \"<a:tcPr\" in cell_xml:\n        cell_xml = re.sub(r\"(<a:tcPr(?:\\s[^>]*)?>)(.*?)</a:tcPr>|<a:tcPr(?:\\s[^>]*)?/>\", tcpr, cell_xml, count=1, flags=re.S)\n    else:\n        cell_xml = cell_xml.replace(\"</a:tc>\", \"<a:tcPr>\" + fill + \"</a:tcPr></a:tc>\")\n\n    def rpr(m):\n        attrs, body = m.group(1), m.group(2) or \"\"\n        attrs = re.sub(r'\\sb=\"[^\"]*\"', \"\", attrs) + ' b=\"1\"'\n        ln = LN_RE.search(body)\n        ln_xml = ln.group(0) if ln else \"\"\n        rest = body.replace(ln_xml, \"\", 1) if ln_xml else body\n        return \"<a:rPr%s>%s%s%s</a:rPr>\" % (attrs, ln_xml, color, FILL_RE.sub(\"\", rest))\n\n    def run(m):\n        r = m.group(0)\n        if \"<a:rPr\" in r:\n            return re.sub(r\"<a:rPr([^>]*?)(?:/>|>(.*?)</a:rPr>)\", rpr, r, count=1, flags=re.S)\n        return r.replace(\"<a:r>\", '<a:r><a:rPr b=\"1\">%s</a:rPr>' % color, 1)\n\n    return RUN_RE.sub(run, cell_xml)\n\n\ndef fill_table(tbl_xml, data, report, rules):\n    def row(m):\n        state = {\"ph\": False, \"value\": False}\n\n        def cell(cm):\n            c = cm.group(0)\n            has_ph = bool(PLACEHOLDER_RE.search(visible_text(c)))\n            c = fill_paragraphs(c, data, report)\n            if has_ph:\n                state[\"ph\"] = True\n                state[\"value\"] = state[\"value\"] or bool(visible_text(c).strip())\n            return colour_cell(c, rules)\n\n        row_xml = CELL_RE.sub(cell, m.group(0))\n        return \"\" if state[\"ph\"] and not state[\"value\"] else row_xml\n\n    return ROW_RE.sub(row, tbl_xml)\n\n\ndef fill_xml(xml, data, report, rules):\n    xml = TBL_RE.sub(lambda m: fill_table(m.group(0), data, report, rules), xml)\n    return fill_paragraphs(xml, data, report)\n\n\n# =========================================================================== pptx\n\n\ndef fill_pptx(data, template_bytes=None):\n    \"\"\"Fill the template. Returns (pptx_bytes, missing_keys).\"\"\"\n    if template_bytes is None:\n        template_bytes = base64.b64decode(\"\".join(TEMPLATE_B64))\n    rules = PROJECT.get(\"settings\", {}).get(\"colour_rules\", [])\n    report = {\"replaced\": set(), \"missing\": set()}\n    out = io.BytesIO()\n    with zipfile.ZipFile(io.BytesIO(template_bytes)) as zin, \\\n            zipfile.ZipFile(out, \"w\", zipfile.ZIP_DEFLATED) as zout:\n        for item in zin.infolist():\n            content = zin.read(item.filename)\n            if re.match(r\"ppt/(slides/slide|notesSlides/notesSlide)\\d+\\.xml$\", item.filename):\n                content = fill_xml(content.decode(\"utf-8\"), data, report, rules).encode(\"utf-8\")\n            zout.writestr(item, content, compress_type=zipfile.ZIP_DEFLATED)\n    # list items that weren't sent (e.g. 3 of 5 table rows) are expected, so don't report them\n    missing = sorted(k for k in report[\"missing\"] if not re.search(r\"\\.\\d+(\\.|$)\", k))\n    return out.getvalue(), missing\n\n\ndef output_name(data):\n    field = PROJECT.get(\"settings\", {}).get(\"file_name_field\") or \"\"\n    found, value = walk(data, field) if field else (False, None)\n    name = re.sub(r\"[^A-Za-z0-9_\\-]+\", \"_\", to_text(value) if found else \"\").strip(\"_\")[:60]\n    fallback = re.sub(r\"[^A-Za-z0-9_\\-]+\", \"_\", str(PROJECT.get(\"name\") or \"\")).strip(\"_\")[:60]\n    return (name or fallback or \"presentation\") + \".pptx\"\n\n\n# =========================================================================== Dify Code node entry\n\n\ndef main(content_json: str) -> dict:\n    try:\n        data = parse_content(content_json)\n        blob, missing = fill_pptx(data)\n    except Exception as exc:\n        return {\"pptx_base64\": \"\", \"file_name\": \"\", \"status\": \"error\",\n                \"message\": \"Could not build the presentation: %s\" % exc}\n    return {\n        \"pptx_base64\": base64.b64encode(blob).decode(\"ascii\"),\n        \"file_name\": output_name(data),\n        \"status\": \"success\",\n        \"message\": (\"Left blank (not in the JSON): \" + \", \".join(missing)) if missing else \"All fields filled.\",\n    }\n\n\n# =========================================================================== command line (your laptop)\n\nif __name__ == \"__main__\":\n    if len(sys.argv) < 2:\n        print(\"usage: python %s <content.json> [output.pptx]\" % sys.argv[0])\n        sys.exit(1)\n    with open(sys.argv[1], encoding=\"utf-8\") as f:\n        body = json.load(f)\n    data = parse_content(body.get(\"content_json\", body) if isinstance(body, dict) else body)\n    blob, missing = fill_pptx(data)\n    out_path = sys.argv[2] if len(sys.argv) > 2 else output_name(data)\n    with open(out_path, \"wb\") as f:\n        f.write(blob)\n    print(\"Saved\", out_path)\n    if missing:\n        print(\"Left blank (not in the JSON):\", \", \".join(missing))\n";

/* ====================================================================== renaming fields */
const KEY_RE = /^[A-Za-z_][A-Za-z0-9_\-]*$/;
function renameKey(from, to, scope) {
  // scope: {type:'plain'|'object-child'|'array'|'array-child', name, sub}
  const map = key => {
    const isCount = key.startsWith("count:");
    let k = isCount ? key.slice(6).trim() : key;
    let out = null;
    if (scope.type === "plain" || scope.type === "array" || scope.type === "object") {
      if (k === from) out = to;
      else if (k.startsWith(from + ".") || k.startsWith(from + "=")) out = to + k.slice(from.length);
    } else if (scope.type === "array-child") {
      const re = new RegExp(`^(${scope.name.replace(/[.\-]/g, "\\$&")}\\.(?:\\d+\\.)?)${scope.sub.replace(/[.\-]/g, "\\$&")}(?=$|[.=\\s])`);
      if (re.test(k)) out = k.replace(re, `$1${to}`);
    } else if (scope.type === "object-child") {
      const full = `${scope.name}.${scope.sub}`;
      if (k === full) out = `${scope.name}.${to}`;
    }
    if (out === null) return null;
    return `{{${isCount ? "count:" + out : out}}}`;
  };
  const before = {};
  let changed = 0;
  for (const name of Object.keys(S.texts)) {
    if (!Engine.isSlidePart(name)) continue;
    const xml = S.texts[name];
    const nx = Engine.rewritePlaceholders(xml, k => map(k));
    if (nx !== xml) { before[name] = xml; setPart(name, nx); changed++; }
  }
  if (!changed) return false;
  S.undo.push(before);
  // move settings
  const F = S.project.fields;
  const moveKey = (a, b) => { if (F[a]) { F[b] = F[a]; delete F[a]; } };
  if (scope.type === "plain") moveKey(from, to);
  else if (scope.type === "array") {
    for (const k of Object.keys(F)) if (k.startsWith(from + "[]")) { F[to + k.slice(from.length)] = F[k]; delete F[k]; }
  } else if (scope.type === "array-child") moveKey(`${scope.name}[].${scope.sub}`, `${scope.name}[].${to}`);
  else if (scope.type === "object-child") moveKey(`${scope.name}.${scope.sub}`, `${scope.name}.${to}`);
  if (S.project.settings.file_name_field === from && scope.type === "plain") S.project.settings.file_name_field = to;
  return true;
}

      toast(`Opened ${file.name} with its field settings.`);
    }
  } catch (e) { toast(e.message || "Couldn't open that file."); }
}
async function downloadKit() {
  const kit = new MiniZip.Zip();
  const code = await buildPython(S.model);
  const folder = safeName(S.project.name);
  kit.set(`${folder}/fill_pptx.py`, code);
  kit.set(`${folder}/template.pptx`, await S.zip.generate());
  kit.set(`${folder}/example_body.json`, JSON.stringify(buildExample(S.model), null, 2));
  kit.set(`${folder}/json_schema.json`, JSON.stringify(buildSchema(S.model), null, 2));
  kit.set(`${folder}/llm_prompt.txt`, buildPrompt(S.model));
  kit.set(`${folder}/fields.json`, JSON.stringify(projectForCode(), null, 2));
  kit.set(`${folder}/README.txt`, [
    `${S.project.name} - made with Template Studio`, "",
    "fill_pptx.py      Paste into a Dify Code node (Python 3), or run: python fill_pptx.py example_body.json out.pptx",
    "                  Input: content_json (String). Outputs: pptx_base64, file_name, status, message (all String).",
    "llm_prompt.txt    System prompt for the Dify LLM node.",
    "json_schema.json  Structured-output schema for the LLM node (optional).",
    "example_body.json Example of the JSON the LLM should return.",
    "template.pptx     The template (also embedded in fill_pptx.py).",
    "fields.json       Field settings. Works with pptx_kit.py: python pptx_kit.py watch template.pptx",
    "", "To keep editing: open template.pptx or fill_pptx.py in Template Studio.",
  ].join("\r\n"));
  saveFile(`${folder}_kit.zip`, new Blob([await kit.generate()]));
}

/* ---------------------------------------------------------------- wiring */
function confirmReplace(msg, onYes) {
  $("#confirmMsg").textContent = msg; $("#confirmBar").hidden = false;
  const done = () => { $("#confirmBar").hidden = true; };
  $("#confirmYes").onclick = () => { done(); onYes(); };
  $("#confirmNo").onclick = done;
}
function undo() {
  const step = S.undo.pop(); if (!step) return;
  for (const [part, xml] of Object.entries(step)) setPart(part, xml);
  S.selCell = null;
  refresh(); toast("Undone");
}
function wire() {
  renderBlocks();
  wireCanvasDrop();
  $("#slideHost").addEventListener("pointerdown", onPointerDown);
  $("#slideHost").addEventListener("dblclick", () => { const t = $("#inspText"); if (t) { t.focus(); t.select(); } });
  $$("[data-view]").forEach(b => b.addEventListener("click", () => setView(b.dataset.view)));
  $$("[data-rtab]").forEach(b => b.addEventListener("click", () => { S.rtab = b.dataset.rtab; renderPanel(); }));
  $("#undoBtn").addEventListener("click", undo);
  $("#projName").addEventListener("input", e => { S.project.name = e.target.value; save(); });
  const menu = $("#openMenu"), mb = $("#openMenuBtn");
  mb.addEventListener("click", () => { menu.hidden = !menu.hidden; mb.setAttribute("aria-expanded", !menu.hidden); });
  document.addEventListener("click", e => { if (!e.target.closest(".menu-wrap")) { menu.hidden = true; mb.setAttribute("aria-expanded", "false"); } });
  menu.addEventListener("click", e => {
    const k = e.target.closest("[data-open]")?.dataset.open; if (!k) return;
    menu.hidden = true;
    if (k === "file") return $("#fileInput").click();
    confirmReplace(k === "blank" ? "Start a new blank template? The current one will be replaced." : "Replace the current template with the audit sample?",
      () => (k === "blank" ? loadBlank() : loadSample()).then(() => { setView("design"); toast(k === "blank" ? "Blank slide ready. Drag a block onto it." : "Audit sample loaded."); }));
  });
  $("#fileInput").addEventListener("change", e => { const f = e.target.files[0]; if (f) openFile(f); e.target.value = ""; });
  $("#kitBtn").addEventListener("click", downloadKit);
  $("#newFieldBtn").addEventListener("click", () => {
    const v = $("#newField").value.trim();
    if (!KEY_RE.test(v)) { toast("Use letters, numbers and _ only, starting with a letter."); return; }
    if (existingRoots().has(v)) { toast(`${v} already exists.`); return; }
    S.project.pending = [...(S.project.pending || []), v];
    $("#newField").value = ""; renderFieldList(); save();
    toast(`Now drag ${v} onto a text box.`);
  });
  $("#newField").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); $("#newFieldBtn").click(); } });
  const onTest = debounce(() => { renderTestPanel(); renderCanvas(); save(); }, 300);
  $("#testJson").addEventListener("input", e => { S.testText = e.target.value; S.testEdited = true; onTest(); });
  $("#resetTestBtn").addEventListener("click", () => { S.testEdited = false; S.testText = JSON.stringify(buildExample(S.model), null, 2); $("#testJson").value = S.testText; renderTestPanel(); renderCanvas(); save(); });
  $("#dlFilledBtn").addEventListener("click", async () => {
    const t = parseTest(); if (t.error) return;
    const f = S.project.settings.file_name_field;
    const [found, v] = f ? Engine.walk(t.data, f) : [false, null];
    saveFile(`${safeName(found ? Engine.toText(v) : S.project.name)}.pptx`, await filledBlob(t.data));
  });
  document.addEventListener("keydown", e => {
    const typing = e.target.closest?.("input, textarea, select, [contenteditable]");
    const mod = e.ctrlKey || e.metaKey;
    if (mod && e.key.toLowerCase() === "z" && !typing) { e.preventDefault(); undo(); return; }
    if (typing || S.view !== "design" || S.selObj === null) return;
    const step = e.shiftKey ? GRID * 10 : GRID;
    if (e.key === "Delete" || e.key === "Backspace") { e.preventDefault(); deleteObj(); }
    else if (e.key === "Escape") { S.selObj = null; S.selCell = null; drawOverlay(); renderPanel(); }
    else if (mod && e.key.toLowerCase() === "d") { e.preventDefault(); duplicateObj(); }
    else if (e.key.startsWith("Arrow")) {
      e.preventDefault();
      nudge(e.key === "ArrowLeft" ? -step : e.key === "ArrowRight" ? step : 0, e.key === "ArrowUp" ? -step : e.key === "ArrowDown" ? step : 0);
    }
  });
  window.addEventListener("resize", debounce(() => { if (S.view !== "code") drawOverlay(); }, 100));
}
async function boot() {
  wire();
  const saved = restore();
  try {
    if (saved?.b64) await openProject(b64ToBytes(saved.b64), saved.project, saved.testText, saved.testEdited, saved.cur);
    else await loadSample();
  } catch (e) { await loadSample(); }
  let v = "design";
  try { v = localStorage.getItem(STORE_KEY + ":view") || "design"; } catch (e) { /* ignore */ }
  setView(["design", "test", "code"].includes(v) ? v : "design");
  window.__studio = { S, insertBlock, placeField, tableOp, addBlankSlide, deleteSlide, duplicateSlide, setView, buildPython, buildExample, buildSchema, buildPrompt, filledBytes, openFile, renameKey, refresh, undo };
}
if (MiniZip.supported()) boot();
else $("#slideHost").innerHTML = '<div class="callout">This browser is too old to open .pptx files. Use a current Chrome, Edge, Safari or Firefox.</div>';

</script>
